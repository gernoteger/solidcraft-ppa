name: PPA

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag (empty: latest release)"
        required: false
        type: string
      series:
        description: "Ubuntu series, space separated (empty: the default list)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ppa-upload
  cancel-in-progress: false

env:
  UPSTREAM_REPO: tangency-labs/solidcraft
  LP_OWNER: gernoteger
  LP_ARCHIVE: solidcraft
  DEFAULT_SERIES: noble resolute
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
      series: ${{ steps.missing.outputs.series }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch upstream release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${TAG:-}" ]; then
            scripts/fetch-upstream.sh "$TAG"
          else
            scripts/fetch-upstream.sh
          fi

      - name: Read package version
        id: meta
        run: |
          set -a
          . vendor/metadata.env
          set +a
          printf 'version=%s\n' "$DEB_VERSION" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$UPSTREAM_DATE" >> "$GITHUB_OUTPUT"

      - name: Check Launchpad for missing series
        id: missing
        env:
          SERIES: ${{ inputs.series || env.DEFAULT_SERIES }}
        run: |
          series=$(scripts/missing-series.sh "${{ steps.meta.outputs.version }}")
          printf 'series=%s\n' "$series" >> "$GITHUB_OUTPUT"
          if [ "$series" = '[]' ]; then
            echo "${{ steps.meta.outputs.version }} is already published for every series." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploading ${{ steps.meta.outputs.version }} to $series" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.missing.outputs.series != '[]'
        uses: actions/upload-artifact@v6
        with:
          name: vendor-debs
          path: |
            vendor/*.deb
            vendor/SHA256SUMS.txt
            vendor/metadata.env
          compression-level: 0
          retention-days: 2

  upload:
    needs: prepare
    if: needs.prepare.outputs.series != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.prepare.outputs.series) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          name: vendor-debs
          path: vendor

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dput debhelper devscripts

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Mark the key as ultimately trusted, so dput's own signature check
          # reports a valid signature instead of a bogus "Error checking
          # signature" (gpgme only sets the validity summary for trusted keys).
          fpr=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '/^fpr:/ { print $10; exit }')
          printf '%s:6:\n' "$fpr" | gpg --batch --import-ownertrust
          gpg --list-secret-keys --keyid-format long

      - name: Build source package
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SERIES: ${{ matrix.series }}
        run: |
          [ -n "$GPG_KEY_ID" ] || { echo "GPG_KEY_ID secret is not set" >&2; exit 1; }
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' >> ~/.gnupg/gpg-agent.conf
            gpgconf --kill gpg-agent
            mapfile -t keygrips < <(
              gpg --batch --with-colons --list-secret-keys "$GPG_KEY_ID" |
                awk -F: '/^grp:/ { print $10 }'
            )
            [ "${#keygrips[@]}" -gt 0 ] || { echo "no keygrip for $GPG_KEY_ID" >&2; exit 1; }
            preset=$(command -v gpg-preset-passphrase ||
              echo /usr/lib/gnupg/gpg-preset-passphrase)
            for keygrip in "${keygrips[@]}"; do
              printf '%s' "$GPG_PASSPHRASE" | "$preset" --preset "$keygrip"
            done
          fi
          scripts/build-source.sh "$SERIES" "${{ needs.prepare.outputs.date }}" "$GPG_KEY_ID"

      - name: Upload to Launchpad
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ matrix.series }}
        run: |
          series_version="${VERSION}+${SERIES}"
          changes="../solidcraft_${series_version}_source.changes"
          test -f "$changes"
          dput "ppa:${LP_OWNER}/${LP_ARCHIVE}" "$changes"

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ matrix.series }}
        run: |
          echo "Uploaded \`${VERSION}+${SERIES}\` for **${SERIES}**" \
            "to https://launchpad.net/~$LP_OWNER/+archive/ubuntu/$LP_ARCHIVE" \
            >> "$GITHUB_STEP_SUMMARY"
